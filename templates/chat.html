<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ bot.name }}와 대화하기</title>
    <link rel="stylesheet" href="{{ asset_url('assets/css/style.css') }}">
    <script src="{{ asset_url('assets/js/chatbot.js') }}" defer></script>
  </head>
  <body class="chat-page">
    <!-- 게임 화면 = 1920×1080 스테이지. 가로 화면은 chatbot.js가 배율(--stage-scale)을 맞추고, 세로 화면은 style.css가 위아래로 쌓는다 -->
    <main class="chat-area stage" data-username="{{ username }}" data-player="{{ player }}">
      <section class="layout-row">
        <div id="tile-record" class="tile-record" aria-label="주고받은 타일 기록"></div>
        <!-- 요리 진행 (메뉴는 숨긴다: 사용자가 무슨 요리인지 모르게): 4단계(재료 선정 → 손질 → 조리 → 플레이팅, 칸 색 = 판정) · 재요청(↻ + 남은 시도) -->
        <!-- 왼쪽 아래 ?: 마우스를 올리거나(터치·키보드는 누르면) 만들 수 있는 요리 성공 그림을 모두 보여 준다 -->
        <div class="dish-help">
          <button type="button" class="dish-help-button" aria-label="만들 수 있는 요리 보기" aria-describedby="dish-help-pop">?</button>
          <div id="dish-help-pop" class="dish-help-pop" role="tooltip">
            <p class="dish-help-line">재료들을 보아하니 이런 걸 만들 수 있을 거 같아~</p>
            {% for dish in dishes %}<img src="{{ dish.image }}" alt="{{ dish.name }}" title="{{ dish.name }}">{% endfor %}
          </div>
        </div>
        <div id="game-hud" class="game-hud" aria-label="요리 진행">
          <ol class="hud-steps">
            <li data-step="select" title="재료 선정">🧺</li>
            <li data-step="prep" title="손질">🔪</li>
            <li data-step="cook" title="조리">🔥</li>
            <li data-step="plate" title="플레이팅">🍽️</li>
          </ol>
        </div>
        <section id="signal-center" class="signal-center" aria-label="외계인">
          <img id="alien-expression" class="alien-expression" alt="외계인" src="{{ asset_url('assets/images/alien/alien_default.png') }}">
          <div id="alien-think" class="alien-think" aria-hidden="true" hidden><canvas class="think-tile" width="128" height="128" hidden></canvas><span class="think-dots">…</span></div>
        </section>
        <!-- 오른쪽 위 패널 하나: 색·질감 선택 → 미리보기·보내기 -->
        <div class="signal-dock">
          <section id="signal-right" class="signal-right" aria-label="색 선택">
            <div id="color-picker" class="color-picker">
              <canvas id="color-canvas" width="220" height="176" aria-label="채도·명도 선택"></canvas>
              <input id="hue-slider" type="range" min="0" max="360" value="0" class="hue-slider" aria-label="색상">
            </div>
            <div class="sense-row" data-axis="freq"></div>
            <div class="sense-row" data-axis="density"></div>
          </section>
          <section id="signal-left" class="signal-left" aria-label="타일 작성기">
            <div class="signal-tile">
              <canvas id="preview-tile" width="200" height="200" aria-label="지금 고르는 타일"></canvas>
            </div>
            <div class="signal-buttons">
              <button type="button" id="undo-btn" class="button-undo" aria-label="보낸 타일 취소" disabled>↺</button>
              <button type="button" id="send-btn" class="button-send" aria-label="보내기">✓</button>
            </div>
          </section>
        </div>
      </section>
    </main>
    <!-- 인트로: 처음 들어올 때만 나오는 대화 장면 (chatbot.js 0번). 대사·그림은 config.intro -->
    <div id="intro" class="intro-overlay" tabindex="-1" hidden>
      <div class="intro-content stage">
        <img class="intro-portrait intro-player" alt="">
        <img class="intro-portrait intro-alien" alt="">
        <div class="intro-board" hidden>
          <img class="intro-board-image" alt="" hidden>
          <div class="intro-tiles"><canvas width="160" height="160"></canvas><canvas width="160" height="160"></canvas><canvas width="160" height="160"></canvas><canvas width="160" height="160"></canvas></div>
        </div>
        <section class="intro-box">
          <p class="intro-name"></p>
          <p class="intro-text" aria-hidden="true"></p>
          <p class="intro-sr sr-only" aria-live="polite"></p>
          <span class="intro-next" aria-hidden="true">▼</span>
        </section>
        <button type="button" class="start-button intro-skip">SKIP</button>
      </div>
    </div>
    <script type="application/json" id="intro-data">{{ intro|tojson }}</script>
    <!-- 결과 화면도 같은 스테이지 방식: 배경·음식·레코드가 같은 좌표를 쓴다. 세 장(data-screen): dish 요리 → record 레코드 → end 결론 카드 -->
    <div id="result-overlay" class="result-overlay" hidden>
      <div class="result-content stage" data-screen="dish">
        <img id="result-image" src="" alt="요리 결과">
        <img id="result-alien" src="" alt="외계인">
        <p id="record-status" class="record-status" hidden>외계인이 신호를 보내는 중이에요</p>
        <section id="result-card" class="result-card" aria-label="결론">
          <p>이 레코드는 외계인의 고향 별로 보내졌습니다.</p>
          <p id="card-dish"></p>
          <p id="card-count"></p>
          <p id="card-style"></p>
          <p class="card-closing">말이 통하지 않아도, 우리는 색과 질감으로 통했다.</p>
        </section>
        <button id="result-next" class="start-button">다음 ▶</button>
        <button id="restart-btn" class="start-button">다시 하기</button>
        <figure class="record">
          <div class="record-disc">
            <img src="{{ asset_url('assets/images/golden_record_cut.png') }}" alt="">
            <canvas id="record-canvas" width="600" height="600" aria-label="주고받은 타일이 새겨진 골든 레코드"></canvas>
            <div id="record-tip" class="record-tip" hidden></div>
          </div>
        </figure>
      </div>
    </div>
  </body>
</html>
